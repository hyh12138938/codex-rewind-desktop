<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex Rewind · 回退与恢复</title>
<style>
:root{font:15px/1.6 system-ui,'Microsoft Yahei',sans-serif;color:#e8e8e5;background:#171918;color-scheme:dark}*{box-sizing:border-box}body{max-width:1060px;margin:0 auto;padding:44px 28px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #3a3e3b;padding-bottom:24px}h1{font-size:28px;letter-spacing:-1px;margin:0}h2{font-size:17px;margin:0 0 16px}p{color:#a9b2aa}button,select,input{font:inherit;border:1px solid #4d5550;background:#272c29;color:inherit;border-radius:7px;padding:9px 14px}button{cursor:pointer}button:hover{background:#38413b}button:disabled{opacity:.45;cursor:wait}.primary{background:#d4edb4;color:#1d2818;border-color:#d4edb4}.primary:hover{background:#e0f8c2}select,input{width:100%;margin-bottom:12px}main{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}section{border:1px solid #3a3e3b;padding:24px;border-radius:10px}.wide{grid-column:1/-1}.row{display:flex;gap:10px;flex-wrap:wrap}small{color:#a9b2aa}.entry{padding:16px 0;border-top:1px solid #3a3e3b}.entry strong{display:block}.entry small{display:block;overflow-wrap:anywhere;margin-bottom:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 ui-monospace,monospace;max-height:300px;overflow:auto}#message{white-space:pre-wrap;min-height:24px;color:#d4edb4}a{color:#d4edb4}label{display:block;margin:8px 0}.error{color:#ffbcb0!important}@media(max-width:760px){main{grid-template-columns:1fr}body{padding:24px 16px}header{align-items:start;gap:12px}}
</style>
<header><div><small>CODEX / LOCAL DESKTOP</small><h1>回退与恢复</h1></div><small>0.1.0 · 手动检查点预览版</small></header>
<p>保存任务起点 → 在 Codex 桌面端完成任务 → 记录完成 → 预览回退。原聊天始终保留，回退后可撤销。</p>
<main>
<section><h2>01 / 保存任务起点</h2><label for="threads">选择已空闲的本地聊天</label><select id="threads"><option>正在读取聊天…</option></select><small id="workspace"></small><label for="label">任务名称</label><input id="label" placeholder="例如：修改登录页之前"><div class="row"><button class="primary" id="save">保存起点</button><button id="refresh">刷新</button></div></section>
<section><h2>02 / 回退预览</h2><p id="previewHint">选择下方任务的“回退”或“仅退聊天”。查看文件清单后确认。</p><pre id="preview"></pre><button class="primary" id="confirm" hidden>确认执行</button><p id="open"></p></section>
<section class="wide"><h2>03 / 已保存任务</h2><div id="checkpoints"></div></section>
<section class="wide"><h2>04 / 撤销回退与中断恢复</h2><div id="operations"></div></section>
</main><p id="message" role="status" aria-live="polite"></p>
<p><small>覆盖普通文件及二进制；跳过 .git、node_modules、.venv 与链接。任务结束后到“记录完成”之间的工作区改动也会被纳入。首次使用建议选择测试项目。</small></p>
<script>
const token=location.hash.slice(1)||sessionStorage.getItem('rewind-token')||'';sessionStorage.setItem('rewind-token',token);history.replaceState(null,'',location.pathname);let currentPreview=null;let threadData=[];
const el=id=>document.getElementById(id);
async function api(method,args={}){let r=await fetch('/',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({method,args})});let d=await r.json();if(!r.ok)throw Error(d.error);return d.result}
function tell(text,error=false){el('message').textContent=text;el('message').className=error?'error':''}
async function run(fn){for(const b of document.querySelectorAll('button'))b.disabled=true;try{await fn()}catch(e){tell(e.message,true)}finally{for(const b of document.querySelectorAll('button'))b.disabled=false}}
function button(text,fn){let b=document.createElement('button');b.textContent=text;b.onclick=()=>run(fn);return b}
function entry(title,detail){let d=document.createElement('div');d.className='entry';let strong=document.createElement('strong');strong.textContent=title;d.append(strong);let small=document.createElement('small');small.textContent=detail;d.append(small);return d}
async function preview(args){currentPreview=null;el('confirm').hidden=true;el('open').replaceChildren();let p=await api('preview',args);currentPreview=p;el('preview').textContent=(p.mode==='redo'?'撤销回退':'回退')+' / '+(p.files?'聊天＋文件':'仅聊天')+'\n\n'+(p.changes.map(c=>c.status+'  '+c.path).join('\n')||'文件保持当前状态')+(p.conflicts.length?'\n\n冲突：\n'+p.conflicts.join('\n'):'');el('confirm').hidden=!!p.conflicts.length;tell(p.conflicts.length?'文件存在额外修改，请先处理冲突。':'预览有效期五分钟；确认后执行。',!!p.conflicts.length)}
async function state(){let s=await api('status');el('checkpoints').replaceChildren();for(const cp of Object.values(s.checkpoints).reverse()){let d=entry(cp.label,cp.root+' · '+cp.thread);let row=document.createElement('div');row.className='row';if(!cp.after)row.append(button('记录完成',async()=>{await api('seal',{checkpoint:cp.id});await state();tell('结束快照已保存，可以预览回退。')}));else{row.append(button('回退聊天和文件',()=>preview({checkpoint:cp.id,files:true})));row.append(button('仅退聊天',()=>preview({checkpoint:cp.id,files:false})))}d.append(row);el('checkpoints').append(d)}if(!Object.keys(s.checkpoints).length)el('checkpoints').textContent='尚无任务起点。';el('operations').replaceChildren();for(const op of Object.values(s.operations).reverse()){let d=entry(op.status==='rewound'?'已回退':op.status==='redone'?'已撤销回退':op.status,op.id);if(op.status==='rewound')d.append(button('预览撤销回退',()=>preview({operation:op.id})));if(['prepared','applying','recovering'].includes(op.status))d.append(button('恢复操作前文件',async()=>{await api('recover',{operation:op.id});await state();tell('已恢复操作前文件状态。')}));el('operations').append(d)}if(!Object.keys(s.operations).length)el('operations').textContent='尚无回退记录。'}
async function refresh(){threadData=await api('threads');el('threads').replaceChildren();for(const t of threadData.filter(t=>t.historyMode==='paginated')){let o=document.createElement('option');o.value=t.id;o.textContent=t.name;el('threads').append(o)}workspace();await state()}
function workspace(){let t=threadData.find(t=>t.id===el('threads').value);el('workspace').textContent=t?t.cwd:'未找到 paginated 本地聊天。'}el('threads').onchange=workspace;
el('refresh').onclick=()=>run(refresh);el('save').onclick=()=>run(async()=>{await api('checkpoint',{thread_id:el('threads').value,label:el('label').value});await state();tell('起点已保存。请在 Codex 中完成任务，再回来点击“记录完成”。')});
el('confirm').onclick=()=>run(async()=>{if(!currentPreview)return;let p=currentPreview;currentPreview=null;el('confirm').hidden=true;let r=await api('apply',{token:p.token});let a=document.createElement('a');a.href=r.url;a.textContent='在 Codex 桌面端打开恢复后的聊天 →';el('open').replaceChildren(a);await state();tell('文件与聊天前缀已核验。点击上方链接打开对应聊天。')});
run(refresh);
</script></html>
